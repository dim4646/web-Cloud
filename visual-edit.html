<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit your site — WebCloud</title>
<style>
  :root{
    --navy:#0B1220;
    --paper:#F6F8FB;
    --white:#FFFFFF;
    --ink:#0B1220;
    --muted:#5A6478;
    --accent:#3DDC97;
    --accent-dim:#1F8F63;
    --line: rgba(11,18,32,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;color:var(--ink);}
  #wc-topbar{
    height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:var(--navy);color:var(--white);
  }
  #wc-topbar .wc-brand{font-weight:700;font-size:.95rem;}
  #wc-topbar .wc-hint{font-size:.78rem;color:rgba(255,255,255,.55);margin-left:14px;}
  #wc-topbar .wc-actions{display:flex;align-items:center;gap:10px;}
  #wc-topbar button{
    border:none;border-radius:8px;padding:9px 16px;font:600 .85rem/1 'Inter',sans-serif;
    cursor:pointer;
  }
  #wc-save-btn{background:var(--accent);color:var(--navy);}
  #wc-save-btn:disabled{opacity:.5;cursor:not-allowed;}
  #wc-close-btn{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.3) !important;}
  #wc-status{font-size:.8rem;color:rgba(255,255,255,.7);margin-right:6px;}
  #wc-canvas{position:fixed;inset:0;top:56px;width:100%;height:calc(100vh - 56px);border:none;}
  #wc-loading, #wc-error{
    position:fixed;inset:0;top:56px;display:flex;align-items:center;justify-content:center;
    background:var(--paper);font-size:.95rem;color:var(--muted);text-align:center;padding:20px;
  }
  #wc-error{display:none;color:#c0392b;z-index:10;}
</style>
</head>
<body>

<div id="wc-topbar">
  <div class="wc-brand">✏️ Edit your site <span class="wc-hint">Click any text to edit it</span></div>
  <div class="wc-actions">
    <span id="wc-status"></span>
    <button id="wc-close-btn" type="button">Close</button>
    <button id="wc-save-btn" type="button">Save changes</button>
  </div>
</div>

<div id="wc-loading">Loading your site…</div>
<div id="wc-error"></div>
<iframe id="wc-canvas" style="display:none;" title="Your site"></iframe>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');
  var loadingEl = document.getElementById('wc-loading');
  var errorEl = document.getElementById('wc-error');
  var canvas = document.getElementById('wc-canvas');
  var statusEl = document.getElementById('wc-status');
  var saveBtn = document.getElementById('wc-save-btn');
  var closeBtn = document.getElementById('wc-close-btn');

  // A real generated draft's body markup (header/nav/hero/sections/footer)
  // is always well over this many characters - used as a floor to detect a
  // draft that failed to load/save properly rather than a genuinely tiny
  // page.
  var MIN_VALID_HTML_LENGTH = 200;

  // Simple inline text-formatting tags a leaf is still allowed to contain
  // (e.g. a <div class="value"> wrapping a bare text node plus a <small>)
  // without disqualifying it - anything else nested inside means the
  // element is a structural container, not a leaf.
  var INLINE_TAGS = ['A','EM','STRONG','SMALL','SPAN','B','I','BR','U','MARK','SUB','SUP','Q','CITE','TIME','CODE'];
  // Never real editable text, regardless of how much text they contain.
  var SKIP_TAGS = ['SCRIPT','STYLE','SELECT','OPTION','INPUT','TEXTAREA','IFRAME','SVG','PATH','NOSCRIPT'];

  // The untouched draft HTML exactly as fetched - kept around so Save can
  // rebuild the page from THIS, not from the live iframe's DOM. See the
  // save handler for why.
  var originalHtml = null;

  var hasEdited = false;

  function showError(msg){
    loadingEl.style.display = 'none';
    canvas.style.display = 'none';
    errorEl.style.display = 'flex';
    errorEl.textContent = msg;
  }

  if (!sessionId) {
    showError('Missing session — please open this page from your draft preview link.');
    return;
  }

  closeBtn.addEventListener('click', function(){
    window.location.href = '/.netlify/functions/preview-draft?session_id=' + encodeURIComponent(sessionId);
  });

  fetch('/.netlify/functions/get-draft?session_id=' + encodeURIComponent(sessionId))
    .then(function(res){
      if (!res.ok) throw new Error(res.status === 404 ? 'Your draft isn\'t ready yet.' : 'Failed to load your site.');
      return res.json();
    })
    .then(function(data){
      if (!data.html || data.html.length < MIN_VALID_HTML_LENGTH) {
        showError('Couldn\'t load your site properly — please refresh, or use "Ask for a change" instead.');
        return;
      }

      originalHtml = data.html;

      canvas.addEventListener('load', function onLoad(){
        loadingEl.style.display = 'none';
        canvas.style.display = 'block';

        var doc = canvas.contentDocument;
        tagEditableElements(doc);
        wireUpPhotoSlots(doc);
        injectEditingStyles(doc);
      }, { once: true });

      // srcdoc iframes share the parent's origin (no sandbox attribute is
      // set here), so contentDocument access below is same-origin - no CORS
      // involved, unlike fetching a cross-origin URL directly.
      canvas.srcdoc = data.html;
    })
    .catch(function(err){
      showError(err.message || 'Something went wrong loading your site.');
    });

  // A "leaf" is an editable-tag element with no editable-tag descendants of
  // its own (so editing never reaches into a heading that itself contains,
  // say, a link) and real text in it. Used identically against both the
  // live iframe document (to decide what to tag contenteditable) and a
  // fresh scratch parse of the original HTML at save time (to find the
  // matching untouched element to write into) - same selector, same
  // document-order walk, same filters, so the Nth result always refers to
  // the same logical element in both documents.
  // Structural (tag-agnostic) leaf test, replacing an earlier fixed
  // tag-name whitelist (h1/p/span/etc.) that missed real text - different
  // AI-generated design variations use plain <div>s for things like footer
  // lines, contact labels/values, and testimonial names/locations just as
  // often as p/span, so a fixed tag list always ends up missing some real
  // text on some drafts (found live 2026-07-28: whole sections of a real
  // draft weren't editable at all). A leaf here is any element with real
  // text whose only child elements (if any) are simple inline formatting
  // tags that are themselves childless - i.e. nothing that looks like a
  // layout container.
  function isEditableCandidate(el){
    if (SKIP_TAGS.indexOf(el.tagName) !== -1) return false;
    if (el.closest('[data-wc-photo]')) return false; // photo slots handle their own content
    if (!el.textContent.trim()) return false; // nothing to edit
    var children = el.children;
    for (var i = 0; i < children.length; i++) {
      var child = children[i];
      if (INLINE_TAGS.indexOf(child.tagName) === -1) return false; // a real container child - too complex
      if (child.children.length > 0) return false; // inline child has its own element children - too complex
    }
    return true;
  }

  function getLeafEditables(doc){
    var candidates = Array.from(doc.body.querySelectorAll('*')).filter(isEditableCandidate);
    var candidateSet = new Set(candidates);
    // Keep only the outermost candidate in any nested chain (e.g. an <li>
    // wrapping a single bare <a> - both would independently qualify, but
    // nested contenteditable regions are invalid, and editing the whole
    // <li> as one unit is the more useful behavior anyway).
    return candidates.filter(function(el){
      for (var p = el.parentElement; p && p !== doc.body; p = p.parentElement) {
        if (candidateSet.has(p)) return false;
      }
      return true;
    });
  }

  function tagEditableElements(doc){
    getLeafEditables(doc).forEach(function(el, i){
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('spellcheck', 'false');
      el.setAttribute('data-wc-edit-id', String(i));
      el.addEventListener('input', function(){ hasEdited = true; });
    });
  }

  function wireUpPhotoSlots(doc){
    doc.querySelectorAll('[data-wc-photo]').forEach(function(el){
      var computed = doc.defaultView.getComputedStyle(el);
      if (computed.position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden';

      // Normalize legacy <img>-based photos into the same background-image
      // approach AI-generated photos already use, so resizing works the
      // same way regardless of how the photo originally got there.
      var legacyImg = el.querySelector('img');
      if (legacyImg) {
        el.style.backgroundImage = 'url(' + legacyImg.src + ')';
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        el.style.backgroundRepeat = 'no-repeat';
        legacyImg.remove();
      }

      var btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'wc-edit-photo-btn';
      btn.textContent = '📷';
      btn.title = 'Change this photo';

      var input = doc.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';

      btn.addEventListener('click', function(){ input.click(); });

      input.addEventListener('change', function(){
        var file = input.files && input.files[0];
        input.value = '';
        if (!file) return;

        btn.disabled = true;
        btn.textContent = '⏳';

        var reader = new FileReader();
        reader.onload = function(){
          var result = String(reader.result || '');
          var m = /^data:(.+);base64,(.*)$/.exec(result);
          if (!m) {
            btn.disabled = false;
            btn.textContent = '📷';
            return;
          }
          fetch('/.netlify/functions/visual-upload-photo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: sessionId,
              contentType: m[1],
              base64: m[2],
              filename: file.name || 'photo.jpg',
            }),
          }).then(function(res){
            if (!res.ok) throw new Error('upload failed');
            return res.json();
          }).then(function(uploaded){
            // Uploads use the same background-image approach as AI photos
            // rather than a separate <img> - one rendering path regardless
            // of where the photo came from, and setting backgroundImage here
            // (replacing whatever was there, AI-photo or previous upload) is
            // what actually clears the old one - found live 2026-07-28 via a
            // real upload where the old AI photo stayed visible behind the
            // new one because it wasn't cleared.
            el.style.backgroundImage = 'url(' + uploaded.url + ')';
            el.style.backgroundSize = 'cover';
            el.style.backgroundPosition = 'center';
            el.style.backgroundRepeat = 'no-repeat';
            el.setAttribute('data-wc-photo-touched', '1');
            hasEdited = true;
            statusEl.textContent = 'Photo added!';
          }).catch(function(){
            statusEl.textContent = 'Photo upload failed — try again.';
          }).finally(function(){
            btn.disabled = false;
            btn.textContent = '📷';
          });
        };
        reader.readAsDataURL(file);
      });

      el.appendChild(btn);
      el.appendChild(input);

      // Resize handle (bottom-right corner, drag to grow/shrink the photo's
      // own frame) + left/right nudge buttons - added 2026-07-29. Two
      // earlier attempts (drag+zoom, then click-to-focus+zoom buttons) both
      // changed what part of a FIXED-size photo shows (cropping/panning
      // within the frame); what was actually wanted was resizing the frame
      // itself bigger/smaller and shifting its position left/right.
      var resizeHandle = doc.createElement('div');
      resizeHandle.className = 'wc-resize-handle';
      resizeHandle.title = 'Drag to resize';
      el.appendChild(resizeHandle);

      var resizing = false, resizeStartX, resizeStartW, resizeStartH, aspectRatio;
      resizeHandle.addEventListener('mousedown', function(e){
        resizing = true;
        var rect = el.getBoundingClientRect();
        resizeStartW = rect.width;
        resizeStartH = rect.height;
        aspectRatio = resizeStartW / resizeStartH;
        resizeStartX = e.clientX;
        e.preventDefault();
        e.stopPropagation();
      });
      doc.addEventListener('mousemove', function(e){
        if (!resizing) return;
        var newW = Math.max(60, resizeStartW + (e.clientX - resizeStartX));
        el.style.width = newW + 'px';
        el.style.height = (newW / aspectRatio) + 'px';
        // Stops a flex-parent's flex-basis/grow/shrink from overriding the
        // explicit size just set above.
        el.style.flex = 'none';
      });
      doc.addEventListener('mouseup', function(){
        if (!resizing) return;
        resizing = false;
        el.setAttribute('data-wc-photo-touched', '1');
        hasEdited = true;
      });

      var nudgeWrap = doc.createElement('div');
      nudgeWrap.className = 'wc-nudge-wrap';
      var nudgeLeftBtn = doc.createElement('button');
      nudgeLeftBtn.type = 'button';
      nudgeLeftBtn.className = 'wc-nudge-btn';
      nudgeLeftBtn.textContent = '←';
      nudgeLeftBtn.title = 'Move left';
      var nudgeRightBtn = doc.createElement('button');
      nudgeRightBtn.type = 'button';
      nudgeRightBtn.className = 'wc-nudge-btn';
      nudgeRightBtn.textContent = '→';
      nudgeRightBtn.title = 'Move right';
      nudgeWrap.appendChild(nudgeLeftBtn);
      nudgeWrap.appendChild(nudgeRightBtn);
      el.appendChild(nudgeWrap);
      // Clicking a nudge button shouldn't also start a resize drag.
      nudgeWrap.addEventListener('mousedown', function(e){ e.stopPropagation(); });

      function nudge(deltaPx){
        var current = parseFloat(el.getAttribute('data-wc-photo-offset-x') || '0') + deltaPx;
        el.setAttribute('data-wc-photo-offset-x', String(current));
        el.style.transform = 'translateX(' + current + 'px)';
        el.setAttribute('data-wc-photo-touched', '1');
        hasEdited = true;
      }
      nudgeLeftBtn.addEventListener('click', function(){ nudge(-20); });
      nudgeRightBtn.addEventListener('click', function(){ nudge(20); });

      // "Try another AI photo" - only offered on slots that already got an
      // AI-generated photo (tracked via data-wc-photo-desc, left by
      // inject-photos.js with the original prompt so a regenerate can reuse
      // it). Reuses the exact same rounds-limited regenerate-photo.js /
      // regenerate-photo-background.js pipeline already wired up in
      // preview-draft.js's floating widget - this just adds the same
      // capability directly inside the visual editor.
      if (el.hasAttribute('data-wc-photo-desc')) {
        var slotId = el.getAttribute('data-wc-photo');
        var regenBtn = doc.createElement('button');
        regenBtn.type = 'button';
        regenBtn.className = 'wc-edit-photo-btn wc-regen-photo-btn';
        regenBtn.textContent = '🔄';
        regenBtn.title = 'Try another AI photo';

        regenBtn.addEventListener('click', function(){
          // regenerate-photo-background.js writes the new photo straight to
          // Airtable's Draft HTML server-side, bypassing this page's own
          // splice-on-save flow entirely - reloading afterward is the only
          // way to pick that up, which would silently discard any unsaved
          // text edit. Simplest safe rule: require a clean save first.
          if (hasEdited) {
            statusEl.textContent = 'Save your text changes first, then try regenerating this photo.';
            return;
          }

          regenBtn.disabled = true;
          regenBtn.textContent = '⏳';
          statusEl.textContent = 'Generating a new photo…';

          fetch('/.netlify/functions/regenerate-photo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: sessionId, slotId: slotId }),
          }).then(function(res){
            if (res.status === 403) throw new Error('limit');
            if (!res.ok) throw new Error('failed');
            return res.json();
          }).then(function(){
            pollUntilPhotoReady(regenBtn);
          }).catch(function(err){
            regenBtn.disabled = false;
            regenBtn.textContent = '🔄';
            statusEl.textContent = err.message === 'limit'
              ? "You've used all your free changes."
              : 'Something went wrong — try again.';
          });
        });

        el.appendChild(regenBtn);
      }
    });
  }

  function pollUntilPhotoReady(regenBtn){
    var attempts = 0;
    var timer = setInterval(function(){
      attempts++;
      fetch('/.netlify/functions/order?session_id=' + encodeURIComponent(sessionId))
        .then(function(res){ return res.ok ? res.json() : null; })
        .then(function(order){
          if (order && order.draftStatus !== 'Self-Editing') {
            clearInterval(timer);
            statusEl.textContent = 'New photo ready — reloading…';
            // The new photo (and rounds-used count) were written straight to
            // Airtable by the background function, not through this page's
            // own save flow - a reload is the simplest way to pick up the
            // fresh draft HTML cleanly, safe here since the hasEdited check
            // above already guaranteed there was nothing unsaved to lose.
            window.location.reload();
          } else if (attempts > 40) {
            clearInterval(timer);
            regenBtn.disabled = false;
            regenBtn.textContent = '🔄';
            statusEl.textContent = 'Taking longer than expected — refresh in a bit to check.';
          }
        })
        .catch(function(){});
    }, 3000);
  }

  function injectEditingStyles(doc){
    var style = doc.createElement('style');
    style.textContent =
      '[data-wc-edit-id]{outline:1px dashed transparent;outline-offset:2px;cursor:text;}' +
      '[data-wc-edit-id]:hover{outline-color:rgba(61,220,151,.6);}' +
      '[data-wc-edit-id]:focus{outline:2px solid #3DDC97;background:rgba(61,220,151,.08);}' +
      '[data-wc-photo]{cursor:default;}' +
      '.wc-edit-photo-btn{position:absolute;top:10px;right:10px;z-index:900;width:36px;height:36px;border-radius:50%;border:none;background:rgba(11,18,32,.82);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);}' +
      '.wc-edit-photo-btn:disabled{opacity:.6;cursor:not-allowed;}' +
      '.wc-regen-photo-btn{right:54px;}' +
      '.wc-resize-handle{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;background:#3DDC97;border:2px solid #0B1220;border-radius:4px;cursor:nwse-resize;z-index:900;}' +
      '.wc-nudge-wrap{position:absolute;left:10px;bottom:10px;z-index:900;display:flex;gap:8px;}' +
      '.wc-nudge-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(11,18,32,.82);color:#fff;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);}';
    doc.head.appendChild(style);
  }

  saveBtn.addEventListener('click', function(){
    if (!hasEdited) {
      statusEl.textContent = 'No changes to save.';
      return;
    }

    var liveDoc = canvas.contentDocument;

    // Rebuild the saved HTML from a FRESH parse of the untouched original
    // draft, not by serializing the live iframe document. Browser
    // extensions (Grammarly, password managers, and similar) are known to
    // inject their own elements/attributes into any page containing
    // contenteditable regions - confirmed live 2026-07-28, where Grammarly's
    // own custom elements and marker attributes ended up baked into a saved
    // draft after nothing more than opening the editor with Grammarly
    // active. Re-parsing the pristine string (which was never inserted into
    // a live page an extension could touch) and splicing in only the exact
    // text/photo changes made here sidesteps this regardless of which
    // extension a given customer's browser happens to have installed -
    // there's no live DOM being trusted wholesale in the first place.
    var scratchDoc = new DOMParser().parseFromString(originalHtml, 'text/html');
    var scratchEditables = getLeafEditables(scratchDoc);

    liveDoc.querySelectorAll('[data-wc-edit-id]').forEach(function(el){
      var idx = Number(el.getAttribute('data-wc-edit-id'));
      if (scratchEditables[idx]) {
        scratchEditables[idx].innerHTML = el.innerHTML;
      }
    });

    liveDoc.querySelectorAll('[data-wc-photo]').forEach(function(el){
      // Only slots actually touched this session (upload, resize, or nudge)
      // - see wireUpPhotoSlots - get written back; an untouched slot's
      // styling stays exactly as it was in the original draft.
      if (el.getAttribute('data-wc-photo-touched') !== '1') return;
      var slotId = el.getAttribute('data-wc-photo');
      var target = scratchDoc.querySelector('[data-wc-photo="' + slotId + '"]');
      if (!target) return;
      target.style.backgroundImage = el.style.backgroundImage;
      target.style.backgroundSize = el.style.backgroundSize;
      target.style.backgroundPosition = el.style.backgroundPosition;
      target.style.backgroundRepeat = el.style.backgroundRepeat;
      if (el.style.width) target.style.width = el.style.width;
      if (el.style.height) target.style.height = el.style.height;
      if (el.style.flex) target.style.flex = el.style.flex;
      if (el.style.transform) target.style.transform = el.style.transform;
      // The scratch doc is a fresh parse of the ORIGINAL html, so a slot
      // that used to render via a legacy <img> (see the normalization in
      // wireUpPhotoSlots) still has that <img> in the scratch copy - remove
      // it now that this slot renders via background-image instead, same
      // "clear the old thing so it doesn't show through" reasoning as
      // clearing backgroundImage was for the reverse direction.
      var legacyImg = target.querySelector('img');
      if (legacyImg) legacyImg.remove();
    });

    var html = '<!DOCTYPE html>' + scratchDoc.documentElement.outerHTML;

    // Never let a save shrink the page down to near-nothing - see
    // MIN_VALID_HTML_LENGTH above. Very unlikely with the splice approach
    // above (there's no way to delete a whole section through this editor),
    // kept as cheap defense-in-depth regardless.
    if (html.length < MIN_VALID_HTML_LENGTH) {
      statusEl.textContent = 'That would leave your site almost empty — not saving.';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    statusEl.textContent = '';

    fetch('/.netlify/functions/visual-edit-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, html: html }),
    }).then(function(res){
      if (!res.ok) throw new Error('save failed');
      return res.json();
    }).then(function(){
      originalHtml = html;
      hasEdited = false;
      statusEl.textContent = 'Saved!';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save changes';
    }).catch(function(){
      statusEl.textContent = 'Something went wrong — try again.';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save changes';
    });
  });
})();
</script>
</body>
</html>
