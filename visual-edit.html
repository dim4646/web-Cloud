<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit your site — WebCloud</title>
<style>
  :root{
    --navy:#0B1220;
    --paper:#F6F8FB;
    --white:#FFFFFF;
    --ink:#0B1220;
    --muted:#5A6478;
    --accent:#3DDC97;
    --accent-dim:#1F8F63;
    --line: rgba(11,18,32,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;color:var(--ink);}
  #wc-topbar{
    height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:var(--navy);color:var(--white);
  }
  #wc-topbar .wc-brand{font-weight:700;font-size:.95rem;}
  #wc-topbar .wc-hint{font-size:.78rem;color:rgba(255,255,255,.55);margin-left:14px;}
  #wc-topbar .wc-actions{display:flex;align-items:center;gap:10px;}
  #wc-topbar button{
    border:none;border-radius:8px;padding:9px 16px;font:600 .85rem/1 'Inter',sans-serif;
    cursor:pointer;
  }
  #wc-save-btn{background:var(--accent);color:var(--navy);}
  #wc-save-btn:disabled{opacity:.5;cursor:not-allowed;}
  #wc-close-btn{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.3) !important;}
  #wc-status{font-size:.8rem;color:rgba(255,255,255,.7);margin-right:6px;}
  #wc-canvas{position:fixed;inset:0;top:56px;width:100%;height:calc(100vh - 56px);border:none;}
  #wc-loading, #wc-error{
    position:fixed;inset:0;top:56px;display:flex;align-items:center;justify-content:center;
    background:var(--paper);font-size:.95rem;color:var(--muted);text-align:center;padding:20px;
  }
  #wc-error{display:none;color:#c0392b;z-index:10;}
</style>
</head>
<body>

<div id="wc-topbar">
  <div class="wc-brand">✏️ Edit your site <span class="wc-hint">Click any text to edit it</span></div>
  <div class="wc-actions">
    <span id="wc-status"></span>
    <button id="wc-close-btn" type="button">Close</button>
    <button id="wc-save-btn" type="button">Save changes</button>
  </div>
</div>

<div id="wc-loading">Loading your site…</div>
<div id="wc-error"></div>
<iframe id="wc-canvas" style="display:none;" title="Your site"></iframe>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');
  var loadingEl = document.getElementById('wc-loading');
  var errorEl = document.getElementById('wc-error');
  var canvas = document.getElementById('wc-canvas');
  var statusEl = document.getElementById('wc-status');
  var saveBtn = document.getElementById('wc-save-btn');
  var closeBtn = document.getElementById('wc-close-btn');

  // A real generated draft's body markup (header/nav/hero/sections/footer)
  // is always well over this many characters - used as a floor to detect a
  // draft that failed to load/save properly rather than a genuinely tiny
  // page. Same protection previously added to the old GrapesJS-based editor,
  // kept here since it's cheap insurance regardless of editor implementation.
  var MIN_VALID_HTML_LENGTH = 200;

  // Elements whose text a customer is allowed to click into and edit
  // directly. Deliberately only "leaf" containers (checked in makeEditable
  // below) - never divs/sections/headers themselves - so contenteditable
  // can never let a customer accidentally merge or restructure sections,
  // only change the words inside them.
  var EDITABLE_SELECTOR = 'h1,h2,h3,h4,h5,h6,p,span,a,li,button,label,strong,em,small,figcaption,blockquote';

  function showError(msg){
    loadingEl.style.display = 'none';
    canvas.style.display = 'none';
    errorEl.style.display = 'flex';
    errorEl.textContent = msg;
  }

  if (!sessionId) {
    showError('Missing session — please open this page from your draft preview link.');
    return;
  }

  closeBtn.addEventListener('click', function(){
    window.location.href = '/.netlify/functions/preview-draft?session_id=' + encodeURIComponent(sessionId);
  });

  // Everything below works directly on the real rendered document inside
  // the iframe - no parsing into an intermediate component model, no
  // separate stylesheet/HTML round-trip. This deliberately replaces an
  // earlier GrapesJS-based editor (removed 2026-07-28) that hit three
  // separate real data-loss/corruption bugs over its lifetime, all rooted
  // in the same cause: GrapesJS re-serializing the page from its own model
  // never round-trips perfectly. Editing the live DOM in place and saving
  // its literal outerHTML has no such round-trip to go wrong.
  fetch('/.netlify/functions/get-draft?session_id=' + encodeURIComponent(sessionId))
    .then(function(res){
      if (!res.ok) throw new Error(res.status === 404 ? 'Your draft isn\'t ready yet.' : 'Failed to load your site.');
      return res.json();
    })
    .then(function(data){
      if (!data.html || data.html.length < MIN_VALID_HTML_LENGTH) {
        showError('Couldn\'t load your site properly — please refresh, or use "Ask for a change" instead.');
        return;
      }

      canvas.addEventListener('load', function onLoad(){
        loadingEl.style.display = 'none';
        canvas.style.display = 'block';

        var doc = canvas.contentDocument;
        makeEditable(doc);
        wireUpPhotoSlots(doc);
        injectEditingStyles(doc);
      }, { once: true });

      // srcdoc iframes share the parent's origin (no sandbox attribute is
      // set here), so contentDocument access below is same-origin - no CORS
      // involved, unlike fetching a cross-origin URL directly.
      canvas.srcdoc = data.html;
    })
    .catch(function(err){
      showError(err.message || 'Something went wrong loading your site.');
    });

  function makeEditable(doc){
    var candidates = doc.body.querySelectorAll(EDITABLE_SELECTOR);
    candidates.forEach(function(el){
      if (el.closest('[data-wc-photo]')) return; // photo slots handle their own content
      if (el.querySelector(EDITABLE_SELECTOR)) return; // not a leaf - has editable descendants of its own
      if (!el.textContent.trim()) return; // nothing to edit
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('spellcheck', 'false');
      el.setAttribute('data-wc-editable', '1');
    });
  }

  function wireUpPhotoSlots(doc){
    doc.querySelectorAll('[data-wc-photo]').forEach(function(el){
      var computed = doc.defaultView.getComputedStyle(el);
      if (computed.position === 'static') el.style.position = 'relative';

      var btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'wc-edit-photo-btn';
      btn.textContent = '📷';
      btn.title = 'Change this photo';

      var input = doc.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.className = 'wc-edit-photo-input';
      input.style.display = 'none';

      btn.addEventListener('click', function(){ input.click(); });

      input.addEventListener('change', function(){
        var file = input.files && input.files[0];
        input.value = '';
        if (!file) return;

        btn.disabled = true;
        btn.textContent = '⏳';

        var reader = new FileReader();
        reader.onload = function(){
          var result = String(reader.result || '');
          var m = /^data:(.+);base64,(.*)$/.exec(result);
          if (!m) {
            btn.disabled = false;
            btn.textContent = '📷';
            return;
          }
          fetch('/.netlify/functions/visual-upload-photo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: sessionId,
              contentType: m[1],
              base64: m[2],
              filename: file.name || 'photo.jpg',
            }),
          }).then(function(res){
            if (!res.ok) throw new Error('upload failed');
            return res.json();
          }).then(function(uploaded){
            el.querySelectorAll('img').forEach(function(img){ img.remove(); });
            var img = doc.createElement('img');
            img.src = uploaded.url;
            img.alt = '';
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;';
            el.insertBefore(img, el.firstChild);
            statusEl.textContent = 'Photo added!';
          }).catch(function(){
            statusEl.textContent = 'Photo upload failed — try again.';
          }).finally(function(){
            btn.disabled = false;
            btn.textContent = '📷';
          });
        };
        reader.readAsDataURL(file);
      });

      el.appendChild(btn);
      el.appendChild(input);
    });
  }

  function injectEditingStyles(doc){
    var style = doc.createElement('style');
    style.setAttribute('data-wc-edit-style', '1');
    style.textContent =
      '[data-wc-editable]{outline:1px dashed transparent;outline-offset:2px;cursor:text;}' +
      '[data-wc-editable]:hover{outline-color:rgba(61,220,151,.6);}' +
      '[data-wc-editable]:focus{outline:2px solid #3DDC97;background:rgba(61,220,151,.08);}' +
      '[data-wc-photo]{cursor:default;}' +
      '.wc-edit-photo-btn{position:absolute;top:10px;right:10px;z-index:900;width:36px;height:36px;border-radius:50%;border:none;background:rgba(11,18,32,.82);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);}' +
      '.wc-edit-photo-btn:disabled{opacity:.6;cursor:not-allowed;}';
    doc.head.appendChild(style);
  }

  saveBtn.addEventListener('click', function(){
    var doc = canvas.contentDocument;

    // Save a cleaned CLONE, not the live document - editing keeps working
    // uninterrupted even if the save fails or the customer keeps typing
    // while the request is in flight.
    var clone = doc.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-wc-editable]').forEach(function(el){
      el.removeAttribute('contenteditable');
      el.removeAttribute('spellcheck');
      el.removeAttribute('data-wc-editable');
    });
    clone.querySelectorAll('.wc-edit-photo-btn, .wc-edit-photo-input').forEach(function(el){ el.remove(); });
    clone.querySelectorAll('style[data-wc-edit-style]').forEach(function(el){ el.remove(); });

    var html = '<!DOCTYPE html>' + clone.outerHTML;

    // Never let a save shrink the page down to near-nothing - see
    // MIN_VALID_HTML_LENGTH above.
    if (html.length < MIN_VALID_HTML_LENGTH) {
      statusEl.textContent = 'That would leave your site almost empty — not saving.';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    statusEl.textContent = '';

    fetch('/.netlify/functions/visual-edit-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, html: html }),
    }).then(function(res){
      if (!res.ok) throw new Error('save failed');
      return res.json();
    }).then(function(){
      statusEl.textContent = 'Saved!';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save changes';
    }).catch(function(){
      statusEl.textContent = 'Something went wrong — try again.';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save changes';
    });
  });
})();
</script>
</body>
</html>
